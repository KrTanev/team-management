name: CI

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python: ['backend-python/**', 'contracts/**']
            node: ['backend-node/**', 'contracts/**']
            frontend: ['frontend/**', 'contracts/**']

  backend-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - name: Contract smoke tests
        run: |
          BD_TEST_MODE=1 DATABASE_URL=sqlite:///./ci.db uv run uvicorn app.main:app --port 8000 &
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          BASE_URL=http://localhost:8000 uv run --with pytest --with httpx pytest ../contracts/tests

  backend-node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - run: npm test
      - name: Contract smoke tests
        run: |
          BD_TEST_MODE=1 DATABASE_URL=ci.db npm start &
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          BASE_URL=http://localhost:8000 uv run --with pytest --with httpx pytest ../contracts/tests

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
